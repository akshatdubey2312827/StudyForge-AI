name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (Type-check, Lint, Test & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-6.0.19
          restore-keys: |
            ${ runner.os }}-mongodb-binaries-

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Type-check and compile backend
        run: npm run build
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
          REDIS_MAX_RETRIES: "3"
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries

  frontend:
    name: Frontend (Type-check & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check and build frontend
        run: npm run build
        working-directory: frontend
